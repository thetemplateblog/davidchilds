{{# Applies the saved theme before first paint so there is no flash. Choices: light, dark, system (default). #}}
<script>
    (function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)');

        function stored() {
            try { return localStorage.getItem('theme') || 'system'; } catch (e) { return 'system'; }
        }

        function render(theme) {
            var dark = theme === 'dark' || (theme === 'system' && media.matches);
            document.documentElement.classList.toggle('dark', dark);
        }

        window.siteTheme = {
            get: stored,
            set: function (theme) {
                try {
                    if (theme === 'system') { localStorage.removeItem('theme'); } else { localStorage.setItem('theme', theme); }
                } catch (e) {}
                render(theme);
            }
        };

        render(stored());

        media.addEventListener('change', function () {
            if (stored() === 'system') { render('system'); }
        });
    })();
</script>
