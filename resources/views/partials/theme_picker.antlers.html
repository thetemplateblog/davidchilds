{{# Light / Dark / System picker. State lives in localStorage via window.siteTheme (partials/theme_script). #}}
<div
    x-data="{ theme: window.siteTheme ? window.siteTheme.get() : 'system', pick(t) { this.theme = t; window.siteTheme && window.siteTheme.set(t) } }"
    role="group"
    aria-label="Color theme"
    class="inline-flex items-center rounded-full border border-neutral-200 dark:border-neutral-800 bg-neutral-100 dark:bg-neutral-900 p-0.5"
>
    <button type="button" @click="pick('light')" :aria-pressed="(theme === 'light').toString()" aria-pressed="false" aria-label="Light theme" title="Light"
        class="inline-flex h-9 w-9 items-center justify-center rounded-full transition-colors"
        :class="theme === 'light' ? 'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-neutral-50' : 'text-neutral-500 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-50'">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" @click="pick('dark')" :aria-pressed="(theme === 'dark').toString()" aria-pressed="false" aria-label="Dark theme" title="Dark"
        class="inline-flex h-9 w-9 items-center justify-center rounded-full transition-colors"
        :class="theme === 'dark' ? 'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-neutral-50' : 'text-neutral-500 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-50'">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button type="button" @click="pick('system')" :aria-pressed="(theme === 'system').toString()" aria-pressed="true" aria-label="Use system theme" title="System"
        class="inline-flex h-9 w-9 items-center justify-center rounded-full transition-colors"
        :class="theme === 'system' ? 'bg-white text-neutral-900 shadow-sm dark:bg-neutral-700 dark:text-neutral-50' : 'text-neutral-500 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-neutral-50'">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
</div>
