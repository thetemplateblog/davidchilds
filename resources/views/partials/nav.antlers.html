    <!-- Modern Navigation Header -->
    <nav class="nav-modern" id="main-nav" x-data="{ open: false }">
        <div class="container mx-auto px-6">
            <div class="flex justify-between items-center h-16">
                <!-- Logo with Icon -->
                <a href="/" class="flex items-center space-x-2 group">
                    <div class="w-8 h-8 bg-neutral-900 dark:bg-neutral-800 rounded-lg flex items-center justify-center">
                        <span class="text-neutral-50 font-mono text-[13px]">DC</span>
                    </div>
                    <span class="text-xl font-semibold text-neutral-900 dark:text-neutral-50 group-hover:text-neutral-700 dark:group-hover:text-neutral-200 transition-colors">
                        David Childs
                    </span>
                </a>
            
            <div class="flex items-center gap-2">
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center space-x-1">
                {{ nav:collection:pages include_home="true" }}
                    {{ if !hide_nav }}
                        <a href="{{ url }}" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-all {{ if is_current }}text-neutral-900 dark:text-neutral-50 bg-neutral-100 dark:bg-neutral-800{{ else }}text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-50 hover:bg-neutral-100 dark:hover:bg-neutral-800{{ /if }}">
                            {{ title }}
                        </a>
                    {{ /if }}
                {{ /nav:collection:pages }}
            </div>

            {{ partial:theme_picker }}

            <!-- Mobile menu button -->
            <button type="button" class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-50 hover:bg-neutral-100 dark:hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-primary-500" @click="open = !open" aria-label="Menu" :aria-expanded="open.toString()" aria-expanded="false">
                <svg class="h-6 w-6" x-bind:class="{ 'hidden': open, 'block': !open }" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
                <svg class="h-6 w-6" x-bind:class="{ 'block': open, 'hidden': !open }" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
            </div>
        </div>
        
        <!-- Mobile menu -->
        <div class="md:hidden bg-white dark:bg-neutral-900" x-show="open" x-transition>
            <div class="px-2 pt-2 pb-3 space-y-1 border-t border-neutral-200 dark:border-neutral-800">
                {{ nav:collection:pages include_home="true" }}
                    {{ if !hide_nav }}
                        <a href="{{ url }}" class="menu-item block px-3 py-2 rounded-md text-base font-medium {{ if is_current }}text-neutral-900 dark:text-neutral-50 bg-neutral-100 dark:bg-neutral-800{{ else }}text-neutral-600 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-neutral-50 hover:bg-neutral-100 dark:hover:bg-neutral-800{{ /if }}">
                            {{ title }}
                        </a>
                    {{ /if }}
                {{ /nav:collection:pages }}
            </div>
        </div>
        </div>
    </nav>
    
    <script>
        // Navigation scroll effect
        let lastScroll = 0;
        const nav = document.getElementById('main-nav');
        
        if (nav) {
            window.addEventListener('scroll', () => {
                const currentScroll = window.pageYOffset;
                
                if (currentScroll > 10) {
                    nav.classList.add('scrolled');
                } else {
                    nav.classList.remove('scrolled');
                }
                
                lastScroll = currentScroll;
            });
        }
    </script>
