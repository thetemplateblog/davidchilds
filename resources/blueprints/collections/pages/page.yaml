title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            import: standard_meta
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: hide_nav
            field:
              type: toggle
              display: 'Hide Nav'
          -
            import: slug
