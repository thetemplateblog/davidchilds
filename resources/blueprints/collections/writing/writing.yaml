title: Writing
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: intro
            field:
              type: markdown
              display: Intro
              validate:
                - required
          -
            handle: image
            field:
              container: assets
              type: assets
              display: Image
          -
            import: standard_meta
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            import: slug
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
          -
            handle: taxonomy_terms
            field:
              type: terms
              display: 'Taxonomy Terms'
          -
            handle: categories
            field:
              type: terms
              taxonomies:
                - categories
              display: Categories
              mode: select
  SEO:
    display: SEO
    sections:
      -
        fields:
          -
            handle: seo
            field:
              type: seo_pro
              listable: false
              display: SEO
